name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          # cache-bust: earlier unlocked runs poisoned the shared key with a
          # freshly-resolved (mixed-orchard) graph; --locked runs must not
          # restore artifacts from that resolution.
          prefix-key: locked-v1
      - run: cargo check --workspace --locked
      - run: cargo test -p zync-core --locked
      - run: cargo test -p zidecar --lib --locked
      - run: cargo clippy --workspace --locked -- -D warnings
