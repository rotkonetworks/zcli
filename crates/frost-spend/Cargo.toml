[package]
name = "frost-spend"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FROST threshold spend authorization for Zcash Orchard"

[features]
default = []
# enable when orchard upstream merges from_sk_ak
wasm = ["getrandom/js"]

[dependencies]
# FROST (RedPallas, rerandomized) on Zakura Common 1.0. zakura-reddsa's `frost`
# feature pulls frost-rerandomized 3.0 with serialization, and enables the
# rand_core_06 shim so FROST APIs keep taking rand_core 0.6 RNGs.
reddsa = { package = "zakura-reddsa", version = "=1.0.0", features = ["frost"] }
# frost-rerandomized 3.0 moved rerandomized signing out of reddsa's redpallas
# module: `redpallas::rerandomized` re-exports aggregate/Randomizer/
# RandomizedParams, but per-share signing with an explicit randomizer (our
# Orchard alpha) is only available as `frost_rerandomized::sign`. Matches the
# version reddsa's `frost` feature pulls.
frost-rerandomized = { version = "=3.0.0" }
ed25519-consensus = "2"
rand_core = "0.6"

# default-features = false drops `multicore`; we only use orchard::keys::*.
# Released crates.io orchard — NU6.3/Ironwood is upstream as of 0.15.0, so no
# fork is needed. The FROST FVK shape upstream lacks a constructor for is
# built from the public raw encoding in keys::frost_fvk (see the note there).
# NOTE: `unstable-voting-circuits` is enabled only to work around a packaging
# bug in zakura-orchard 1.0.0/1.0.1: keys.rs gates `visibility::make(pub)` on
# `unstable-frost`, but the optional `visibility` dep is pulled in by
# `unstable-voting-circuits` instead - so `unstable-frost` alone fails to build.
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false, features = ["unstable-frost", "unstable-voting-circuits"] }

# Pallas curve
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }

# OSST: nested FROST + reshare (public extract from zeratul)
# "std" is required for osst::redpallas (rand_core::OsRng); without it the
# package only compiles when another workspace member happens to enable the
# feature, so `cargo build -p frost-spend` failed in isolation.
# Vendored pasta-1.0 (Zakura Common 1.0) port at crates/osst. Path dep (not a
# workspace [patch]) so bin/zecli and bin/poker keep their old git osst.
osst = { path = "../osst", default-features = false, features = ["pallas", "std"] }

# round-2 package sealing (see sealed.rs). Noise_K, the same pattern ZF's
# frost-client uses, so this is the ecosystem's transport rather than ours.
# default-features=false drops the ring backend; the pure-Rust resolver is
# what keeps the wasm build (zafu) working.
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
# frostd authenticates a login by verifying an XEdDSA signature over its
# challenge, made with the SAME X25519 key used for Noise. Signal's
# construction, and the reason ZF can get away with one key for both.
xeddsa = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"

# hashing
sha2 = "0.10"
blake2b_simd = "1.0"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = { version = "0.4", features = ["serde"] }

# optional WASM support
getrandom = { version = "0.2", optional = true }
