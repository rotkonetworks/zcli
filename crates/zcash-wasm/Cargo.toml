[package]
name = "zafu-wasm"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "WASM bindings for Zafu Zcash wallet - parallel trial decryption with SIMD"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel"]
# Gate orchard/multicore here so wasm-single (no parallel) skips halo2's
# multicore code paths — keeps the single artifact ~3% smaller.
parallel = ["rayon", "wasm-bindgen-rayon", "orchard/multicore"]

[dependencies]
# crypto primitives (WASM-compatible)
pasta_curves = "0.5"
subtle = "2.5"
ff = "0.13"
group = "0.13"

# Orchard protocol - real key derivation and note encryption.
# NU6.3 / Ironwood stack (frozen interface contract, section 0):
#   librustzcash crates: valargroup fork, branch adam/qleak-pr44-orchard-dummy-ciphertexts
#     (zcash_primitives 0.28 / pczt 0.7 / zcash_keys 0.14 / zcash_protocol 0.9 /
#      zcash_transparent 0.8) - lock pins rev 0c3ad735
#   orchard 0.14: zcash/orchard branch adam/qleak-dummy-ciphertexts-on-pr505
#     - lock pins rev 204d8ce9
# These are the SAME pins the zigner spike rust/pczt_signing_valar uses (its
# Cargo.lock is the source of truth for revs). Build native AND wasm with:
#   RUSTFLAGS='--cfg zcash_unstable="nu6.3"'
orchard = { version = "0.15.5", default-features = false, features = ["circuit"] }
zcash_keys = { version = "0.16", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_address = { version = "0.13", default-features = false }
zcash_protocol = { version = "0.10", default-features = false }
rand_core = "0.6"
zip32 = { version = "0.2", default-features = false }

# merkle witness building
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
hex = "0.4"

# force indexmap's `std` feature across the dep graph so halo2_proofs
# (which pulls indexmap with default-features = false) can use
# IndexMap::new() — otherwise `has_std` cfg isn't set under `-Z build-std`
# and the build fails with "struct takes 3 generic arguments".
indexmap = { version = "1", features = ["std"] }

# note encryption (no heavy circuit deps)
zcash_note_encryption = "0.4"

# transaction primitives
# zcash_primitives 0.28 + sapling-crypto 0.7 + orchard 0.14 line up with the
# valargroup librustzcash workspace on the NU6.3 branch — the same version
# coords the zigner valar spike consumes. Required for `pczt` V6 interop.
zcash_primitives = { version = "0.30", default-features = false, features = ["non-standard-fees", "transparent-inputs"] }
zcash_transparent = { version = "0.10", package = "zcash_transparent", default-features = false, features = ["transparent-inputs"] }

# Partially-Created Zcash Transaction (PCZT) construction.
# Pinned to the same librustzcash fork branch that zigner's valar spike
# consumes so orchard/sapling/zcash_primitives versions match byte-for-byte.
pczt = { version = "0.9", default-features = false, features = ["orchard", "transparent", "sapling", "zcp-builder", "prover", "io-finalizer", "tx-extractor", "signer", "spend-finalizer"] }
# zcash_primitives renames sapling-crypto to `sapling` internally; mirror the
# alias so BuildConfig's `Option<sapling::Anchor>` field type-checks.
# `circuit` feature pulls bellman+groth16 proving — bloats the wasm but is
# required because pczt's prover/io-finalizer code paths reference
# sapling::pczt::ProverError / Prover even when the tx has no sapling actions.
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["circuit"] }

# key derivation
bip39 = { version = "2.0", features = ["rand"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"

# secp256k1 / transparent address support
# NOTE: secp256k1 is a DIRECT dependency (not just dev) because the ironwood
# shielding builder feeds `secp256k1::PublicKey` to
# `Builder::add_transparent_p2pkh_input` and `secp256k1::SecretKey` to
# `pczt::roles::signer::Signer::sign_transparent`. It must stay pinned to the
# exact version zcash_transparent/pczt use (0.29) or those types would be from a
# different crate instance and would not type-check. Test targets also see this
# dep, so the existing integration tests keep compiling.
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }
k256 = { version = "0.13", features = ["ecdsa-core", "ecdsa", "sha256"] }
hmac = "0.12"
sha2 = "0.10"
ripemd = "0.1"
blake2b_simd = "1.0"

# wasm bindings
wasm-bindgen = "0.2.113"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

# rng for proving
rand = "0.8"

# FROST threshold multisig
frost-spend = { path = "../frost-spend", features = ["wasm"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# UR encoding for QR transport
ur = "0.4"

# Verified erasure-coded QR transport
zoda-vss = { path = "../zoda-vss", default-features = false }

# parallel processing (optional, enabled by default)
rayon = { version = ">=1.10, <1.11", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = "0.5"
rand = "0.8"
# secp256k1 moved to [dependencies] (the ironwood shielding builder needs it at
# lib level); test targets inherit it, so tests/ still `use secp256k1::…`.

[[bench]]
name = "scanning"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu6.3"))'] }
