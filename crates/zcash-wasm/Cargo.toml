[package]
name = "zafu-wasm"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "WASM bindings for Zafu Zcash wallet - parallel trial decryption with SIMD"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel", "voting"]
# Zakura Common 1.0's orchard fork does not expose a `multicore` feature (halo2
# multicore is handled inside zakura-halo2-proofs), so `parallel` only wires up
# rayon + wasm-bindgen-rayon now. The old `orchard/multicore` toggle is gone.
parallel = ["rayon", "wasm-bindgen-rayon"]
# Shielded-voting + PIR delegation stack (zcash-voting, pir-client, imt-tree).
# Gated so the proving core can build without the voting cluster.
voting = ["dep:zcash-voting", "dep:pir-client", "dep:imt-tree"]

[dependencies]
# crypto primitives (WASM-compatible) — Zakura Common 1.0 (pasta-1.0 / ff+group 0.14)
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }
subtle = "2.5"
ff = "0.14"
group = "0.14"

# Orchard protocol - real key derivation and note encryption.
# NU6.3 / Ironwood stack — upstream crates.io releases (no forks, no [patch]).
#   orchard 0.15.5 carries the qleak dummy-ciphertext privacy fix
#   (OutputInfo::randomized_ciphertext / fabricated_for_spend) that used to
#   live only on the valar/zcash fork branches.
#   zcash_protocol 0.10.x ships the real NU6.3 branch id (0x37a5165b,
#   mainnet activation 3_428_143) and V6 version group id 0xD884B698 —
#   NU6.3 is fully ungated upstream, so no zcash_unstable cfg is needed.
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false, features = ["circuit"] }
zcash_keys = { package = "zakura-keys", version = "=1.0.0", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_address = { version = "0.13", default-features = false }
zcash_protocol = { version = "0.10", default-features = false }
rand_core = "0.6"
# rand_core 0.10 (pure-trait) for the OsRng10 adapter that feeds Zakura Common
# 1.0's builders/signers, which now bound their RNG on rand_core 0.10's `Rng`.
rand_core_10 = { package = "rand_core", version = "0.10", default-features = false }
zip32 = { version = "0.2", default-features = false }

# merkle witness building
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
hex = "0.4"

# force indexmap's `std` feature across the dep graph so halo2_proofs
# (which pulls indexmap with default-features = false) can use
# IndexMap::new() — otherwise `has_std` cfg isn't set under `-Z build-std`
# and the build fails with "struct takes 3 generic arguments".
indexmap = { version = "1", features = ["std"] }

# note encryption (no heavy circuit deps)
zcash_note_encryption = "0.4"

# transaction primitives
# zcash_primitives 0.28 + sapling-crypto 0.7 + orchard 0.14 line up with the
# Released librustzcash workspace (NU6.3 is upstream as of these versions)
# coords the zigner valar spike consumes. Required for `pczt` V6 interop.
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0", default-features = false, features = ["non-standard-fees", "transparent-inputs"] }
zcash_transparent = { version = "0.10", package = "zcash_transparent", default-features = false, features = ["transparent-inputs"] }

# Partially-Created Zcash Transaction (PCZT) construction.
# Pinned to the same librustzcash fork branch that zigner's valar spike
# consumes so orchard/sapling/zcash_primitives versions match byte-for-byte.
pczt = { package = "zakura-pczt", version = "=0.1.0-rc2", default-features = false, features = ["orchard", "transparent", "sapling", "zcp-builder", "prover", "io-finalizer", "tx-extractor", "signer", "spend-finalizer"] }
# zcash_primitives renames sapling-crypto to `sapling` internally; mirror the
# alias so BuildConfig's `Option<sapling::Anchor>` field type-checks.
# `circuit` feature pulls bellman+groth16 proving — bloats the wasm but is
# required because pczt's prover/io-finalizer code paths reference
# sapling::pczt::ProverError / Prover even when the tx has no sapling actions.
sapling = { package = "zakura-sapling-crypto", version = "=1.0.0", default-features = false, features = ["circuit"] }

# key derivation
bip39 = { version = "2.0", features = ["rand"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"

# secp256k1 / transparent address support
# NOTE: secp256k1 is a DIRECT dependency (not just dev) because the ironwood
# shielding builder feeds `secp256k1::PublicKey` to
# `Builder::add_transparent_p2pkh_input` and `secp256k1::SecretKey` to
# `pczt::roles::signer::Signer::sign_transparent`. It must stay pinned to the
# exact version zcash_transparent/pczt use (0.29) or those types would be from a
# different crate instance and would not type-check. Test targets also see this
# dep, so the existing integration tests keep compiling.
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }
k256 = { version = "0.13", features = ["ecdsa-core", "ecdsa", "sha256"] }
hmac = "0.12"
sha2 = "0.10"
ripemd = "0.1"
blake2b_simd = "1.0"

# wasm bindings
wasm-bindgen = "0.2.113"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

# PIR client for IMT non-membership proofs (delegation). Vendored path fork with
# tokio stripped for wasm; the Transport trait is network-free (we back it with a
# JS `fetch` callback), so no hyper/tonic/tokio enters wasm.
pir-client = { path = "../pir-client", optional = true }
# The IMT proof field type (imt_tree::ImtProofData) and its Fp field elements.
# Zakura Common 1.0: imt-tree 0.5.2 gained a `zakura` feature (pasta-1.0).
imt-tree = { version = "=0.5.2", default-features = false, features = ["zakura"], optional = true }
# pir_client's Transport trait returns anyhow::Result.
anyhow = "1"

# rng for proving
rand = "0.8"

# FROST threshold multisig
frost-spend = { path = "../frost-spend", features = ["wasm"] }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
base64 = "0.22"

# Shielded-voting crypto core (HOT vote casting). wasm-slim = pure byte-in/out:
# no SQLite, no lightwalletd/tonic, no PIR, no std::thread. See
# crates/zcash-voting for the vendored path fork.
zcash-voting = { package = "zcash_voting", path = "../zcash-voting", default-features = false, features = ["wasm-slim"], optional = true }

# UR encoding for QR transport
ur = "0.4"

# Verified erasure-coded QR transport
zoda-vss = { path = "../zoda-vss", default-features = false }

# parallel processing (optional, enabled by default)
rayon = { version = ">=1.10, <1.11", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

# Zakura Common 1.0's crypto stack (rand 0.10) pulls getrandom 0.4, whose
# wasm32 backend must be opted into via the `wasm_js` feature AND a
# `--cfg getrandom_backend="wasm_js"` rustflag (added to the wasm32 rustflags in
# .cargo/config.toml). Depending on it directly enables that feature on the
# transitive copy. (getrandom 0.2 with `js` stays for the older transitive copy.)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = "0.5"
rand = "0.8"
# secp256k1 moved to [dependencies] (the ironwood shielding builder needs it at
# lib level); test targets inherit it, so tests/ still `use secp256k1::…`.

[[bench]]
name = "scanning"
harness = false
