[package]
name = "zync-core"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Trust-minimized Zcash light client primitives: verification, scanning, proving"
repository = "https://github.com/rotkonetworks/zcli"
keywords = ["zcash", "ligerito", "light-client", "zk-proofs"]
categories = ["cryptography"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["client", "parallel"]
client = ["tonic", "prost", "tokio", "tokio-stream", "tracing"]
parallel = ["rayon"]

wasm = [
    "getrandom/js",
    "wasm-bindgen",
    "console_error_panic_hook",
]

wasm-parallel = [
    "wasm",
    "parallel",
    "wasm-bindgen-rayon",
    "js-sys",
]

[dependencies]
# ligerito polynomial commitment scheme
ligerito = { version = "0.6.0", path = "../ligerito", features = ["transcript-blake2b"] }
ligerito-binary-fields = { version = "0.6.1", path = "../ligerito-binary-fields" }

blake2 = "0.10"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
hex = "0.4"
bincode = "1.3"

# nomt merkle proof verification
nomt-core = { version = "1.0", features = ["blake3-hasher", "serde"] }
bitvec = "1"

# zcash — Zakura Common 1.0 (zakura-orchard 1.0), the SAME orchard the native
# zecli graph now uses everywhere (via zafu-wasm / frost-spend). This retires
# the second, upstream `orchard 0.15.5` that used to split the native graph.
# default-features would pull orchard's `circuit`, and with it halo2_gadgets
# (GHSA soundness advisory). zync-core never builds or verifies an orchard
# proof — it needs the note-decryption key types only — so the circuit is dead
# weight AND a vulnerable dependency. No `unstable-frost`: nothing here touches
# a frost-gated API (the re-exported FullViewingKey/IncomingViewingKey/Scope/
# SpendingKey are all ungated). Keep `multicore` for the note-decryption
# parallelism we do use, and to agree with the rest of the native graph.
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false, features = ["multicore"] }
zcash_note_encryption = "0.4"
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }
subtle = "2.5"

# gRPC client (optional)
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }

# parallel scanning
rayon = { version = "1.10", optional = true }

# WASM
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
rand = "0.8"
