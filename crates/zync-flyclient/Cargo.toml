[package]
name = "zync-flyclient"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FlyClient verification over the Zcash ZIP-221 chain history tree"
repository = "https://github.com/rotkonetworks/zcli"
keywords = ["zcash", "light-client", "flyclient"]
categories = ["cryptography"]

# Kept apart from zync-core so a wasm wallet can verify proofs without
# zync-core's orchard (`multicore`) and gRPC dependencies.

[dependencies]
blake2b_simd = "1"
equihash = { version = "0.3", default-features = false }
primitive-types = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "1.0"
zcash_history = "0.6"
zcash_protocol = { package = "zakura-protocol", version = "=2.0.0", default-features = false }

[dev-dependencies]
bincode = "1.3"
# tromp's solver, to forge a pow-limit block in a test
equihash = { version = "0.3", features = ["solver"] }
hex = "0.4"
