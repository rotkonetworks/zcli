[package]
name = "zcash_voting"
version = "2.0.0-rc.2"
edition = "2021"
rust-version = "1.88"
description = "Client-side library for Zcash shielded voting: ZKP delegation and vote-commitment proofs (Halo 2), ElGamal encryption, governance PCZT construction, Merkle witness generation, and SQLite round-state persistence. Vendored path fork for zafu-wasm (wasm-slim casting slice)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[features]
default = ["native"]
# `native` = full upstream crate: SQLite round-state persistence, tokio/hyper/tonic
# lightwalletd + PIR network transport, and the wallet-db orchestration modules.
native = [
    "dep:rusqlite",
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:tonic",
    "dep:rustls",
    "dep:http-body-util",
    "dep:pir-client",
    "dep:pir-types",
    "dep:valar-spiral-rs",
    "dep:valar-ypir",
    "dep:vote-commitment-tree-client",
    "dep:zcash_client_sqlite",
    "dep:zcash_client_backend",
]
# `wasm-slim` = pure crypto core only (byte-in/out): hotkey, governance,
# note_bundling, vote_commitment, zkp1, zkp2, action, wire, wire_codec, types,
# error, phases, config, share_policy, plus the wasm_casting free fns. No SQLite,
# no network, no PIR, no std::thread spawns.
wasm-slim = []
# `parallel` = forward halo2's multicore proving (maybe-rayon/rayon) through
# to the underlying halo2_proofs instance shared with voting-circuits. Mirrors
# zafu-wasm's `parallel = [..., "orchard/multicore"]` recipe: the host crate
# (voting-wasm) must ALSO link wasm-bindgen-rayon and call initThreadPool()
# before the first proof, or rayon's global pool init panics on wasm32
# (no JS-side Worker spawn glue without it).
parallel = ["halo2_proofs/multicore"]

[dependencies]
# Curves (same as Orchard/Zcash)
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }
ff = "0.14"
group = "0.14"

# Randomness
rand = "0.8"
# rand_core 0.10 (pure-trait) for the OsRng10 adapter bridging rand 0.8's OsRng
# to the rand_core 0.10 `Rng` bound that Zakura Common 1.0's ff/orchard/
# voting-circuits now require at RNG call sites.
rand_core_10 = { package = "rand_core", version = "0.10", default-features = false }

# Hashing
blake2b_simd = "1"
halo2_gadgets = { package = "zakura-halo2-gadgets", version = "=1.0.0" }
halo2_proofs = { package = "zakura-halo2-proofs", version = "=1.0.0" }
sinsemilla = { package = "zakura-sinsemilla", version = "=1.0.0" }

# Serialization
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
sha2 = "0.10"
ed25519-dalek = "2"

# PIR (private nullifier exclusion proofs) — native only.
pir-client = { version = "=0.4.0-rc.2", default-features = false, optional = true }
pir-types = { version = "=0.3.0-rc.2", default-features = false, optional = true }
valar-spiral-rs = { version = "=0.5.2", default-features = false, optional = true }
valar-ypir = { version = "=0.1.5", default-features = false, optional = true }
imt-tree = { version = "=0.5.2", default-features = false, features = ["zakura"] }

bytes = { version = "1" }
http = { version = "1" }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1", "http2"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"], optional = true }

vote-commitment-tree = { version = "=0.6.0", default-features = false, features = ["zakura"] }
vote-commitment-tree-client = { version = "=0.6.0-rc.1", features = ["http"], optional = true }

# Storage — native only.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

# Error handling
anyhow = "1"
thiserror = "2"
zeroize = "1"

# Crypto core (all wasm-OK).
subtle = "2.6"
orchard = { package = "zakura-orchard", version = "=1.0.0", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.11.2" }
nonempty = "0.11"
zip32 = "0.2"
incrementalmerkletree = "0.8"

zcash_protocol = { version = "0.10" }
zcash_client_backend = { version = "0.24.0-rc.7", features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"], default-features = false, optional = true }
zcash_client_sqlite = { version = "0.22.0-rc.8", features = ["orchard"], default-features = false, optional = true }
zcash_keys = { package = "zakura-keys", version = "=1.0.0", features = ["orchard"] }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc2", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0" }
uuid = "1.23.1"

# wasm32 needs getrandom's browser backend. The zafu-wasm host also pins
# getrandom/js; declaring it here keeps the standalone wasm-slim build green.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
secrecy = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
vote-commitment-tree = { version = "=0.6.0", default-features = false, features = ["zakura"] }
vote-commitment-tree-client = { version = "=0.6.0-rc.1", features = ["http"] }
bip39 = "2"
