[package]
name = "voting-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone WASM bindings for zafu shielded voting - delegation PCZT, hot vote-casting, and PIR non-membership proofs. Kept independent of zafu-wasm (the core wallet module) so orchard/pczt/zcash_primitives versions never have to co-version with the wallet scanner."

[lib]
crate-type = ["cdylib"]

[features]
# Mirrors crates/zcash-wasm's recipe exactly: rayon + wasm-bindgen-rayon give
# the host (offscreen prover) an initThreadPool export; zcash-voting/parallel
# forwards into halo2_proofs/multicore + orchard/multicore so the K=14
# delegation proof actually runs on the pool once it's initialized.
parallel = ["rayon", "wasm-bindgen-rayon", "zcash-voting/parallel"]

[dependencies]
# Curves - only for the PIR nullifier field element handling.
pasta_curves = { package = "zakura-pasta-curves", version = "=2.0.0" }
ff = "0.14"

# Shielded-voting crypto core (delegation ZKP #1, hot vote casting).
# wasm-slim = pure byte-in/out: no SQLite, no lightwalletd/tonic, no PIR
# network transport, no std::thread. See crates/zcash-voting for the vendored
# fork this pins against.
zcash-voting = { package = "zcash_voting", path = "../zcash-voting", default-features = false, features = ["wasm-slim"] }

# PIR client for IMT non-membership proofs (delegation dummy/real nullifiers).
# Vendored path fork with tokio stripped for wasm; the Transport trait is
# network-free (backed by a JS `fetch` callback), so no hyper/tonic/tokio
# enters wasm.
pir-client = { path = "../pir-client" }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
anyhow = "1"

# wasm bindings
wasm-bindgen = "0.2.113"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

# parallel processing (optional, enabled via --features parallel)
rayon = { version = ">=1.10, <1.11", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

# The Zakura Common 2.0 crypto stack (rand 0.10) pulls getrandom 0.4, whose
# wasm32 backend needs the `wasm_js` feature plus the
# `--cfg getrandom_backend="wasm_js"` rustflag already in the workspace
# .cargo/config.toml. Same pin as crates/zcash-wasm; without it the wasm32
# build stops at getrandom's compile_error!.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# [profile.release] intentionally omitted: cargo ignores per-package profiles
# for non-root workspace members (see build warning); the workspace root has
# no [profile.release] override, so this builds under cargo's plain release
# defaults, matching zafu-wasm's own recipe (see BUILD_PROVENANCE.md).

[dev-dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
vote-commitment-tree = { version = "=0.6.3", default-features = false, features = ["zakura"] }
vote-commitment-tree-client = { version = "=0.8.3", features = ["http"] }
