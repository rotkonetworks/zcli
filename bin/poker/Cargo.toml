[package]
name = "poker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "heads-up poker CLI with frostito escrow via relay"

[[bin]]
name = "poker"
path = "src/main.rs"

[dependencies]
# grpc client
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
prost = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# frostito (nested FROST + OSST), canonical upstream penumbrafi/frostito
# pinned in [workspace.dependencies]. osst 0.2.0 is on zakura-pasta-curves
# 1.0, the same pasta as poker's own pallas types.
# `legacy-v1` is the nested FROST v1 construction, which osst 0.4.0 moved
# behind an off-by-default feature as INSECURE (finding R-1 of
# SECURITY-REVIEW-2026-09: the outer binding factor multiplies the identity and
# vanishes, admitting a ROS-style forgery). This demo's `dispute` path is the
# "existing deployment compiling while it migrates" case the feature exists
# for — it is a single-process TUI with no value at stake. Do NOT copy this
# line into anything that signs for real; migrate to the v2 nested position
# (see crates/frost-spend/src/nested.rs) instead.
osst = { workspace = true, features = ["std", "pallas", "legacy-v1"] }

# crypto
rand = "0.8"
sha2 = "0.10"
blake2b_simd = "1.0"
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0", default-features = false, features = ["alloc"] }

# zcash address derivation
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false }
zcash_address = "0.13"
zcash_protocol = { version = "0.10", default-features = false }
zip32 = { version = "0.2", default-features = false }

# cli
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.11"
