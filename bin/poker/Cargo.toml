[package]
name = "poker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "heads-up poker CLI with frostito escrow via relay"

[[bin]]
name = "poker"
path = "src/main.rs"

[dependencies]
# grpc client
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
prost = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# frostito (nested FROST + OSST)
# crates/osst is the Zakura Common 1.0 (pasta-1.0) port of frostito's osst.
# poker has to be on the same pasta as its pallas types, so it takes the path
# fork rather than the git rev pinned to pasta-0.5. The OSST wire encoding is
# unchanged — same curve, same point/scalar serialization.
osst = { path = "../../crates/osst", default-features = false, features = ["std", "pallas"] }

# crypto
rand = "0.8"
sha2 = "0.10"
blake2b_simd = "1.0"
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0", default-features = false, features = ["alloc"] }

# zcash address derivation
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false }
zcash_address = "0.13"
zcash_protocol = { version = "0.10", default-features = false }
zip32 = { version = "0.2", default-features = false }

# cli
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.11"
