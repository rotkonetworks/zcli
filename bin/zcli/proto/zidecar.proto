syntax = "proto3";
package zidecar.v1;

// Zidecar gRPC service
// Provides Ligerito-proven header chain and trustless state proofs
service Zidecar {

    // Stream compact blocks in range
    rpc GetCompactBlocks(BlockRange) returns (stream CompactBlock);

    // Get current chain tip
    rpc GetTip(Empty) returns (BlockId);

    // Subscribe to new blocks (live feed)
    rpc SubscribeBlocks(Empty) returns (stream BlockId);

    // Get sync status (blockchain height, epoch progress, epoch proof status)
    rpc GetSyncStatus(Empty) returns (SyncStatus);

    // Send raw transaction to the network
    rpc SendTransaction(RawTransaction) returns (SendResponse);

    // Get transaction by hash
    rpc GetTransaction(TxFilter) returns (RawTransaction);

    // Get all transactions at a block height (privacy-preserving memo retrieval)
    // Client fetches entire block, hides which specific tx they care about
    rpc GetBlockTransactions(BlockId) returns (BlockTransactions);

    // Get tree state at a given height (for merkle paths)
    rpc GetTreeState(BlockId) returns (TreeState);

    // Get transparent UTXOs for an address
    rpc GetAddressUtxos(TransparentAddressFilter) returns (UtxoList);

    // Get transparent transaction history for addresses
    rpc GetTaddressTxids(TransparentAddressFilter) returns (TxidList);

    // ===== TRUSTLESS STATE PROOFS (v2) =====

    // Stream current mempool as compact actions (height=0 = unconfirmed)
    // Client scans all actions locally for privacy (trial decrypt + nullifier check)
    rpc GetMempoolStream(Empty) returns (stream CompactBlock);

    // FlyClient proof over the ZIP-221 chain history tree, from the anchor
    // epoch up to the tip (see zync_core::flyclient). Opt-in on the server
    // (--flyclient); UNIMPLEMENTED/UNAVAILABLE when it is off.
    rpc GetFlyClientProof(FlyClientProofRequest) returns (FlyClientProofResponse);
}

// Block range query
message BlockRange {
    uint32 start_height = 1;
    uint32 end_height = 2;
}

// Compact block (actions only, no tx metadata)
message CompactBlock {
    uint32 height = 1;
    bytes hash = 2;
    repeated CompactAction actions = 3;
    // 4 was actions_root, for the retired Ligerito actions commitment
    reserved 4;
    // Ironwood actions (NU6.3+); same compact shape as Orchard.
    repeated CompactAction ironwood_actions = 5;
}

// Compact Orchard action for trial decryption
message CompactAction {
    bytes cmx = 1;              // note commitment (32 bytes)
    bytes ephemeral_key = 2;    // ephemeral public key (32 bytes)
    bytes ciphertext = 3;       // compact ciphertext (52 bytes)
    bytes nullifier = 4;        // nullifier (32 bytes)
    bytes txid = 5;             // transaction hash (32 bytes) - for memo retrieval
}

// Block identifier
message BlockId {
    uint32 height = 1;
    bytes hash = 2;
}

// Empty message
message Empty {}

// Sync status information
message SyncStatus {
    // Current blockchain height from zebrad
    uint32 current_height = 1;
    // 2-7 described the retired Ligerito epoch proofs
    reserved 2, 3, 4, 5, 6, 7;
}

// Raw transaction for send/receive
message RawTransaction {
    bytes data = 1;     // raw transaction bytes
    uint32 height = 2;  // block height (0 for unconfirmed)
}

// Response from SendTransaction
message SendResponse {
    string txid = 1;        // transaction hash if successful
    int32 error_code = 2;   // 0 = success
    string error_message = 3;
}

// Filter for GetTransaction
message TxFilter {
    bytes hash = 1;  // 32-byte transaction hash
}

// Tree state at a block height (for building spends)
message TreeState {
    uint32 height = 1;
    bytes hash = 2;                    // block hash
    uint64 time = 3;                   // block timestamp
    string sapling_tree = 4;           // hex-encoded sapling commitment tree
    string orchard_tree = 5;           // hex-encoded orchard commitment tree
    string ironwood_tree = 6;           // hex-encoded ironwood commitment tree (empty pre-NU6.3)
}

// Filter for transparent address queries
message TransparentAddressFilter {
    repeated string addresses = 1;     // t-addresses (t1... or t3...)
    uint32 start_height = 2;           // optional start height
    uint32 max_entries = 3;            // optional limit (0 = no limit)
}

// List of transparent UTXOs
message UtxoList {
    repeated Utxo utxos = 1;
}

// Single transparent UTXO
message Utxo {
    string address = 1;         // t-address
    bytes txid = 2;             // 32-byte transaction hash
    uint32 output_index = 3;    // output index in transaction
    bytes script = 4;           // scriptPubKey
    uint64 value_zat = 5;       // value in zatoshis
    uint32 height = 6;          // block height (0 = unconfirmed)
}

// List of transaction IDs
message TxidList {
    repeated bytes txids = 1;   // 32-byte transaction hashes
}

// All transactions at a block height (for privacy-preserving memo retrieval)
message BlockTransactions {
    uint32 height = 1;
    bytes hash = 2;                         // block hash
    repeated RawTransaction txs = 3;        // all transactions in block
}

// ===== TRUSTLESS STATE PROOF MESSAGES (v2) =====

// ===== BATCH QUERY MESSAGES =====

// ===== EPOCH BOUNDARY MESSAGES =====

// ===== FLYCLIENT (ZIP-221) =====

// Both sides must use the same parameters: they decide which blocks the
// proof opens. 0 means the default (lambda 40, tail 16).
message FlyClientProofRequest {
    uint32 lambda = 1;
    uint32 tail = 2;
}

// One opened block: its header, its history-tree leaf, and the siblings from
// the leaf up to its peak.
message FlyLeaf {
    uint64 index = 1;
    bytes header = 2;
    bytes leaf = 3;
    repeated bytes path = 4;
}

// One epoch's tree as committed by commit_header (height activation + n_leaves).
message FlyEpoch {
    uint32 activation = 1;
    uint32 branch_id = 2;
    uint64 n_leaves = 3;
    bytes commit_header = 4;
    bytes auth_data_root = 5;   // empty for Heartwood/Canopy epochs
    repeated bytes peaks = 6;
    repeated FlyLeaf leaves = 7;
}

// Epochs newest first; the last one starts at the server's anchor.
message FlyClientProofResponse {
    repeated FlyEpoch epochs = 1;
    uint32 anchor_height = 2;
}
