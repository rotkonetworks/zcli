// lightwalletd gRPC service protocol
// https://github.com/zcash/lightwalletd/blob/master/walletrpc/service.proto

syntax = "proto3";
package cash.z.wallet.sdk.rpc;

// CompactTx contains the index and hash of a transaction, along with its compact outputs
message CompactTx {
    uint64 index = 1;
    bytes hash = 2;
    uint32 fee = 3;
    repeated CompactSaplingSpend spends = 4;
    repeated CompactSaplingOutput outputs = 5;
    repeated CompactOrchardAction actions = 6;
}

message CompactSaplingSpend {
    bytes nf = 1;
}

message CompactSaplingOutput {
    bytes cmu = 1;
    bytes ephemeralKey = 2;
    bytes ciphertext = 3;
}

message CompactOrchardAction {
    bytes nullifier = 1;
    bytes cmx = 2;
    bytes ephemeralKey = 3;
    bytes ciphertext = 4;
}

// CompactBlock is a compact representation of a block
message CompactBlock {
    uint32 protoVersion = 1;
    uint64 height = 2;
    bytes hash = 3;
    bytes prevHash = 4;
    uint32 time = 5;
    bytes header = 6;
    repeated CompactTx vtx = 7;
    ChainMetadata chainMetadata = 8;
}

message ChainMetadata {
    uint32 saplingCommitmentTreeSize = 1;
    uint32 orchardCommitmentTreeSize = 2;
}

// Block ID message
message BlockID {
    uint64 height = 1;
    bytes hash = 2;
}

// Block range for queries
message BlockRange {
    BlockID start = 1;
    BlockID end = 2;
}

// Raw transaction for sending
message RawTransaction {
    bytes data = 1;
    uint64 height = 2;
}

// Transaction send response
message SendResponse {
    int32 errorCode = 1;
    string errorMessage = 2;
}

// Get address UTXOs
message GetAddressUtxosArg {
    repeated string addresses = 1;
    uint64 startHeight = 2;
    uint32 maxEntries = 3;
}

message GetAddressUtxosReply {
    string address = 1;
    bytes txid = 2;
    int32 index = 3;
    bytes script = 4;
    int64 valueZat = 5;
    uint64 height = 6;
}

message GetAddressUtxosReplyList {
    repeated GetAddressUtxosReply addressUtxos = 1;
}

// Transparent address block filter
message TransparentAddressBlockFilter {
    string address = 1;
    BlockRange range = 2;
}

// Light wallet info
message LightdInfo {
    string version = 1;
    string vendor = 2;
    bool taddrSupport = 3;
    string chainName = 4;
    uint64 saplingActivationHeight = 5;
    string consensusBranchId = 6;
    uint64 blockHeight = 7;
    string gitCommit = 8;
    string branch = 9;
    string buildDate = 10;
    string buildUser = 11;
    uint64 estimatedHeight = 12;
    string zcashdBuild = 13;
    string zcashdSubversion = 14;
}

// Tree state
message TreeState {
    string network = 1;
    uint64 height = 2;
    string hash = 3;
    uint32 time = 4;
    string saplingTree = 5;
    string orchardTree = 6;
}

// Empty message
message Empty {}

// Shielded protocol enum for subtree queries
enum ShieldedProtocol {
    sapling = 0;
    orchard = 1;
}

// Request for GetSubtreeRoots
message GetSubtreeRootsArg {
    uint32 startIndex = 1;
    ShieldedProtocol shieldedProtocol = 2;
    uint32 maxEntries = 3;
}

// Subtree root response
message SubtreeRoot {
    bytes rootHash = 2;
    bytes completingBlockHash = 3;
    uint64 completingBlockHeight = 4;
}

message Address {
    string address = 1;
}

message AddressList {
    repeated string addresses = 1;
}

message Balance {
    int64 valueZat = 1;
}

message Duration {
    int64 intervalUs = 1;
}

message PingResponse {
    int64 entry = 1;
    int64 exit = 2;
}

// Identifier for a Zcash value pool. Used by GetMempoolTxRequest.pool_types.
enum PoolType {
    POOL_TYPE_INVALID = 0;
    TRANSPARENT = 1;
    SAPLING = 2;
    ORCHARD = 3;
}

message GetMempoolTxRequest {
    // Transaction-ID byte-string suffixes to exclude from the response.
    repeated bytes excludeTxidSuffixes = 1;
    // Reserved for a possible future excludeTxidPrefixes field.
    reserved 2;
    // If empty, defaults to [SAPLING, ORCHARD] (canonical lwd behavior).
    repeated PoolType poolTypes = 3;
}

// Lightwalletd service definition
service CompactTxStreamer {
    // Get latest block
    rpc GetLatestBlock(ChainSpec) returns (BlockID);

    // Get block by ID
    rpc GetBlock(BlockID) returns (CompactBlock);

    // Get block by ID, returning only the nullifier-bearing portions of each tx.
    rpc GetBlockNullifiers(BlockID) returns (CompactBlock);

    // Get block range (streaming)
    rpc GetBlockRange(BlockRange) returns (stream CompactBlock);

    // Get block range (streaming), nullifier-only — same shape as GetBlockRange
    // but each CompactTx only carries the spend nullifiers (no outputs/cmx).
    rpc GetBlockRangeNullifiers(BlockRange) returns (stream CompactBlock);

    // Get transaction by txid
    rpc GetTransaction(TxFilter) returns (RawTransaction);

    // Send raw transaction
    rpc SendTransaction(RawTransaction) returns (SendResponse);

    // Stream historic transparent-address txids in a height range
    rpc GetTaddressTxids(TransparentAddressBlockFilter) returns (stream RawTransaction);

    // Like GetTaddressTxids but emits the full RawTransaction.data per tx.
    rpc GetTaddressTransactions(TransparentAddressBlockFilter) returns (stream RawTransaction);

    // Total balance for a list of transparent addresses
    rpc GetTaddressBalance(AddressList) returns (Balance);

    // Client-streaming variant: same semantics as GetTaddressBalance but the
    // address list is delivered as a stream from the client.
    rpc GetTaddressBalanceStream(stream Address) returns (Balance);

    // Long-poll stream of mempool transactions; terminates when chain tip moves.
    rpc GetMempoolStream(Empty) returns (stream RawTransaction);

    // Mempool snapshot in CompactTx form, filtered by exclude-suffix + pool type.
    rpc GetMempoolTx(GetMempoolTxRequest) returns (stream CompactTx);

    // Get tree state at height
    rpc GetTreeState(BlockID) returns (TreeState);

    // Tree state at the current chain tip
    rpc GetLatestTreeState(Empty) returns (TreeState);

    // Get address UTXOs
    rpc GetAddressUtxos(GetAddressUtxosArg) returns (GetAddressUtxosReplyList);

    // Stream address UTXOs
    rpc GetAddressUtxosStream(GetAddressUtxosArg) returns (stream GetAddressUtxosReply);

    // Get lightwalletd info
    rpc GetLightdInfo(Empty) returns (LightdInfo);

    // Get subtree roots for efficient syncing
    rpc GetSubtreeRoots(GetSubtreeRootsArg) returns (stream SubtreeRoot);

    // Liveness probe; sleeps intervalUs then returns concurrency counters.
    rpc Ping(Duration) returns (PingResponse);
}

// Chain specification
message ChainSpec {}

// Transaction filter
message TxFilter {
    BlockID block = 1;
    uint64 index = 2;
    bytes hash = 3;
}
