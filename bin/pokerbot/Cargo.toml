[package]
name = "pokerbot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "headless heads-up poker bot: drives the production poker-pvm engine over the real E2EE relay for high-pace bug testing (free + paid)"

[lib]
name = "pokerbot"
path = "src/lib.rs"

[[bin]]
name = "pokerbot"
path = "src/main.rs"

[dependencies]
# the PRODUCTION game engine (native std build; dependency-free). tests exactly what ships.
# pinned git dep — CI has no sibling zeratul checkout; the engine is pulled
# from the public repo at the exact rev the bot was validated against
poker-pvm = { git = "https://github.com/rotkonetworks/zeratul.git", rev = "6309866acd850114971d9834a27bdaec5d6e2a29" }

# async + websocket relay client (wss:// to zkbtc.org/ws or a local relay)
tokio = { version = "1", features = ["full"] }
# read-only HTTPS GET for `probe-staked` (the plain `/new?buyin=..` room mint that
# 303-redirects with the room code in `location`). Redirect following is DISABLED
# so we only read the header, never load the redirect target. Feature set matches
# the workspace `zcli` reqwest so no extra crates compile; rustls, no native-tls.
reqwest = { version = "0.12", features = ["rustls-tls", "http2"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# rustls is already in the tree via tokio-tungstenite; declared directly only so we
# can install its ring CryptoProvider at startup (rustls 0.23 no longer auto-selects one).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# E2EE: x25519 ECDH -> HKDF-SHA256 -> AES-256-GCM  (byte-identical to the browser WebCrypto path)
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"

# rng (seeded for reproducible fuzz runs)
rand = "0.8"
rand_chacha = "0.3"

# json wire messages + cli + logging
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# FROST DKG: the SAME shared lib the escrow + zcli use — dkg_part1/2/3 +
# derive_address_from_sk / derive_fvk_from_sk. Path dep (workspace member).
frost-spend = { path = "../../crates/frost-spend" }
# Orchard UA + UFVK encoding for the DKG-derived group key (mirrors the escrow's
# orchard_ua.rs so both sides land on the byte-identical escrow UA / UFVK string).
zcash_address = "0.13"
# PCZT decode for the C3 blind-signer safety check (verify_pczt_recipients): parse
# the payout PCZT the escrow asks us to FROST-sign and read every Orchard output's
# recipient (raw 43-byte receiver) + value in the clear. We only READ
# output.recipient()/value() — plain accessors on pczt's own structs — so we do
# not pull the orchard crate in directly; `orchard` enables the orchard bundle.
#
# Zakura Common 1.0's zakura-pczt, matching the rest of the workspace. Parsing
# is version-tagged by the PCZT bytes themselves, and the real escrow-built
# fixtures in payout_test_fixtures.rs (generated by poker-escrow's
# gen_pczt_fixtures) still decode to the same recipients and values under it —
# that round-trip is what pins interop with the escrow, not the crate version.
pczt = { package = "zakura-pczt", version = "=0.1.0-rc2", default-features = false, features = ["orchard"] }
# frostd transport: ZF's own frost-client (Noise_K cipher + session HTTP client),
# so the bot joins the escrow's frostd DKG session; + rendezvous room-code deps.
# Same rev as zecli so the on-wire cipher stays byte-identical across all clients.
frost-client = { git = "https://github.com/ZcashFoundation/frost-tools", rev = "06c0dbd" }
uuid = { version = "1", features = ["v4", "serde"] }
bip39 = { version = "2.0", features = ["rand"] }
# lets the DKG joiner protocol be generic over the WS and frostd transports
async-trait = "0.1"
zcash_protocol = { version = "0.10", default-features = false }
# ff::PrimeField — sample a valid Pallas scalar for the fvk-seed sk (host mode).
ff = "0.14"
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }
rand_core = "0.6"

[dev-dependencies]
# spin up a real in-process frostd to prove the FrostdDkg adapter round-trips
frostd = { git = "https://github.com/ZcashFoundation/frost-tools", rev = "06c0dbd" }
axum = "0.8"
