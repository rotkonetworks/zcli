[workspace]
resolver = "2"
members = [
    "bin/zcli",
    "bin/zclid",
    "bin/zidecar",
    "crates/zync-core",
    "crates/ligerito",
    "crates/ligerito-binary-fields",
    "crates/ligerito-merkle",
    "crates/ligerito-reed-solomon",
    "crates/zcash-wasm",
    "crates/frost-spend",
    "crates/zoda-vss",
    "bin/relay",
    "bin/poker",
    "crates/ring-vrf-wasm",
    "bin/license-server",
]

# The vendored librustzcash fork is its own workspace (see the [patch] below);
# keep it out of ours so its crates inherit workspace.package from the
# vendored root, not from us.
exclude = [
    "vendor/librustzcash",
]

[workspace.package]
authors = ["rotko networks"]
edition = "2021"
license = "MIT"
repository = "https://github.com/rotkonetworks/zcli"

[workspace.dependencies]
ligerito = { path = "crates/ligerito" }
ligerito-binary-fields = { path = "crates/ligerito-binary-fields" }
ligerito-merkle = { path = "crates/ligerito-merkle" }
ligerito-reed-solomon = { path = "crates/ligerito-reed-solomon" }
zync-core = { path = "crates/zync-core" }

# shared deps inherited by ligerito crates
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
criterion = "0.5"
hex = "0.4"
merlin = "3.0"
proptest = "1.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
wide = { version = "0.7", default-features = false }

[patch.crates-io]
maybe-rayon = { path = "crates/maybe-rayon" }

# NU6.3 / Ironwood real params fix (FIX-A, money path).
#
# The pinned valargroup/librustzcash rev 0c3ad735 (branch
# adam/qleak-pr44-orchard-dummy-ciphertexts) hardcodes the NU6.3 consensus
# branch id as the placeholder 0xffff_ffff and activation_height(Nu6_3) => None.
# The turnstile sighash MUST bind the real branch id 0x37a5165b (activation
# height 3_428_143 on mainnet) or every produced tx is invalid on-chain.
#
# Rather than depend on an out-of-band fork being reachable, we vendor the exact
# pinned checkout under vendor/librustzcash with the three-line consensus patch
# applied (see vendor/librustzcash/components/zcash_protocol/src/consensus.rs)
# and [patch] the git source to it. This is fully reproducible offline and the
# patched source is committed. All nine crates the lock pulls from that source
# are overridden so Cargo does not mix patched and unpatched copies.
[patch."https://github.com/valargroup/librustzcash"]
equihash = { path = "vendor/librustzcash/components/equihash" }
f4jumble = { path = "vendor/librustzcash/components/f4jumble" }
pczt = { path = "vendor/librustzcash/pczt" }
zcash_address = { path = "vendor/librustzcash/components/zcash_address" }
zcash_encoding = { path = "vendor/librustzcash/components/zcash_encoding" }
zcash_keys = { path = "vendor/librustzcash/zcash_keys" }
zcash_primitives = { path = "vendor/librustzcash/zcash_primitives" }
zcash_protocol = { path = "vendor/librustzcash/components/zcash_protocol" }
zcash_transparent = { path = "vendor/librustzcash/zcash_transparent" }


# Optional local dev: uncomment to develop against a sibling zeratul checkout.
# Do NOT commit this uncommented — it breaks CI, which only clones zcli.
# [patch."https://github.com/rotkonetworks/zeratul.git"]
# osst = { path = "../zeratul/crates/osst" }
