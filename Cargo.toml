[workspace]
resolver = "2"
members = [
    "bin/zcli",
    "bin/zclid",
    "bin/zidecar",
    "bin/integration-v09",
    "crates/zync-core",
    "crates/ligerito",
    "crates/ligerito-binary-fields",
    "crates/ligerito-merkle",
    "crates/ligerito-reed-solomon",
    "crates/zcash-wasm",
    "crates/zcash-voting",
    "crates/pir-client",
    "crates/frost-spend",
    "crates/osst",
    "crates/zoda-vss",
    "bin/relay",
    "bin/poker",
    "bin/pokerbot",
    "crates/ring-vrf-wasm",
    "crates/voting-wasm",
    "bin/license-server",
]

[workspace.package]
authors = ["rotko networks"]
edition = "2021"
license = "MIT"
repository = "https://github.com/rotkonetworks/zcli"

[workspace.dependencies]
ligerito = { path = "crates/ligerito" }
ligerito-binary-fields = { path = "crates/ligerito-binary-fields" }
ligerito-merkle = { path = "crates/ligerito-merkle" }
ligerito-reed-solomon = { path = "crates/ligerito-reed-solomon" }
zync-core = { path = "crates/zync-core" }

# shared deps inherited by ligerito crates
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
criterion = "0.5"
hex = "0.4"
merlin = "3.0"
proptest = "1.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
wide = { version = "0.7", default-features = false }

[profile.release]
# LTO + single codegen unit: 5-20% runtime on the compute-heavy wasm (proving
# AND scanning), for longer build times. Universal, fork-independent win.
lto = true
codegen-units = 1

[patch.crates-io]
maybe-rayon = { path = "crates/maybe-rayon" }

# Vendored osst (frostito) ported to Zakura Common 1.0 (pasta-1.0). Redirects
# the git dependency used by frost-spend, bin/zcli and bin/poker in one move.
# TODO(upstream): push the pasta-1.0 pallas backend to github.com/rotkonetworks/frostito.
[patch."https://github.com/rotkonetworks/frostito"]
osst = { path = "crates/osst" }

# Zakura Common 1.0 (pasta-1.0 generation) is now consumed directly as the
# crates.io `zakura-*` packages (see per-crate Cargo.toml package renames), so
# the old git-fork [patch] block that redirected orchard/pasta/halo2/reddsa/
# sinsemilla at the 0.15.x `zakura-core/libraries` rev is gone.

# vendored librustzcash fork removed: NU6.3 / Ironwood is upstream as of the
# released crates (zcash_primitives 0.30 / zcash_protocol 0.10 / orchard
# 0.15.5), including the real branch id 0x37a5165b that the fork stubbed as
# 0xffff_ffff. No patch, no vendor, no fork.

# Optional local dev: uncomment to develop against a sibling zeratul checkout.
# Do NOT commit this uncommented — it breaks CI, which only clones zcli.
# [patch."https://github.com/rotkonetworks/zeratul.git"]
# osst = { path = "../zeratul/crates/osst" }
