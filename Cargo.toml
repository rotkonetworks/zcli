[workspace]
resolver = "2"
members = [
    "bin/zcli",
    "bin/zclid",
    "bin/zidecar",
    "bin/integration-v09",
    "crates/zync-core",
    "crates/ligerito",
    "crates/ligerito-binary-fields",
    "crates/ligerito-merkle",
    "crates/ligerito-reed-solomon",
    "crates/zcash-wasm",
    "crates/zcash-voting",
    "crates/pir-client",
    "crates/frost-spend",
    "crates/zoda-vss",
    "bin/relay",
    "bin/poker",
    "bin/pokerbot",
    "crates/ring-vrf-wasm",
    "crates/voting-wasm",
    "bin/license-server",
]

[workspace.package]
authors = ["rotko networks"]
edition = "2021"
license = "MIT"
repository = "https://github.com/rotkonetworks/zcli"

[workspace.dependencies]
ligerito = { path = "crates/ligerito" }
ligerito-binary-fields = { path = "crates/ligerito-binary-fields" }
ligerito-merkle = { path = "crates/ligerito-merkle" }
ligerito-reed-solomon = { path = "crates/ligerito-reed-solomon" }
zync-core = { path = "crates/zync-core" }

# shared deps inherited by ligerito crates
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
criterion = "0.5"
hex = "0.4"
merlin = "3.0"
proptest = "1.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
wide = { version = "0.7", default-features = false }

[profile.release]
# LTO + single codegen unit: 5-20% runtime on the compute-heavy wasm (proving
# AND scanning), for longer build times. Universal, fork-independent win.
lto = true
codegen-units = 1

[patch.crates-io]
maybe-rayon = { path = "crates/maybe-rayon" }

# Zakura proving-stack fork (zakura-core/libraries, main @ b44390b). Portable
# halo2/orchard proving speedups that apply to our wasm32 build - the merged set
# on main incl. lookup-argument compression and fixed-window witness (help every
# rayon worker, so they carry into the parallel build), plus SIMD multiexp. The
# native ADX `pasta_msm` backend has no dependents here, so wasm excludes it.
# NOTE: the larger multiexp wins (Booth recoding, evaluator CSE, fixed-base MSM
# table) are still on unmerged agent/* branches - revisit the rev when they land.
halo2_proofs = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
halo2_gadgets = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
halo2_poseidon = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
halo2_legacy_pdqsort = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
orchard = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
pasta_curves = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
reddsa = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }
sinsemilla = { git = "https://github.com/zakura-core/libraries", rev = "b44390bc487a37187a161b5b0f2536a6567afa8e" }

# vendored librustzcash fork removed: NU6.3 / Ironwood is upstream as of the
# released crates (zcash_primitives 0.30 / zcash_protocol 0.10 / orchard
# 0.15.5), including the real branch id 0x37a5165b that the fork stubbed as
# 0xffff_ffff. No patch, no vendor, no fork.

# Optional local dev: uncomment to develop against a sibling zeratul checkout.
# Do NOT commit this uncommented — it breaks CI, which only clones zcli.
# [patch."https://github.com/rotkonetworks/zeratul.git"]
# osst = { path = "../zeratul/crates/osst" }
