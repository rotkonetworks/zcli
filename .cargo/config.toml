[target.wasm32-unknown-unknown]
# NU6.3 / Ironwood is enabled for the wasm blob by adding the cfg HERE rather
# than via the RUSTFLAGS env var: setting RUSTFLAGS on the command line REPLACES
# this whole array (dropping the link-args below), which produces a private,
# non-shared memory and breaks rayon's postMessage + halo2 proving. See
# packages/zcash-wasm/BUILD_PROVENANCE.md. Keeping the cfg inline preserves the
# link-args and still exports the ironwood turnstile functions.
rustflags = [
    "--cfg", "zcash_unstable=\"nu6.3\"",
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128",
    "-C", "link-args=--shared-memory",
    "-C", "link-args=--import-memory",
    "-C", "link-args=--export-table",
    "-C", "link-args=--max-memory=2147483648",
    "-C", "link-args=--export=__wasm_init_tls",
    "-C", "link-args=--export=__tls_size",
    "-C", "link-args=--export=__tls_align",
    "-C", "link-args=--export=__tls_base",
]
# wasm parallel build requires nightly:
# RUSTUP_TOOLCHAIN=nightly cargo build --target wasm32-unknown-unknown -Zbuild-std=panic_abort,std

[alias]
# Rebuild just the .wasm for the parallel zafu bundle. Assumes nightly is
# selected (RUSTUP_TOOLCHAIN=nightly or `cargo +nightly wasm-parallel`).
wasm-parallel = "build -p zafu-wasm --target wasm32-unknown-unknown --release -Zbuild-std=panic_abort,std"

# Single-threaded — needs build-std because global RUSTFLAGS force +atomics
# and prebuilt stable std lacks them. Output still requires SharedArrayBuffer.
wasm-single = "build -p zafu-wasm --target wasm32-unknown-unknown --release --no-default-features -Zbuild-std=panic_abort,std"
